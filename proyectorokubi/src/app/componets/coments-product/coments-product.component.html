<div class="comentarios">

  <ion-input
    class="nuevoComent"
    placeholder="Nuevo comentario"
    [(ngModel)]="nuevoComentario"
    type="text">
  </ion-input>

  <ion-button (click)="nuevoCommet()">
    Enviar comentario
  </ion-button>

  <div>
    <ion-title>Comentarios</ion-title>
    
    <app-lista-comentarios [id]="id" padre="producto"></app-lista-comentarios>
  </div>
</div>
