<div class="perfil">

  <ion-avatar>
    <img  [src]="datosUsuario?.avatar" [alt]="datosUsuario?.name"/>
  </ion-avatar>

  <ion-title class="nombre">{{datosUsuario?.name}}</ion-title>
  <ion-text class="datos">Rut: {{datosUsuario?.rut}}</ion-text>
  <ion-text class="datos">Mail: {{datosUsuario?.mail}}</ion-text>
  <ion-text class="datos">Región: {{datosUsuario?.region}}</ion-text>
  <ion-text class="datos">Comuna: {{datosUsuario?.comuna}}</ion-text>


</div>
